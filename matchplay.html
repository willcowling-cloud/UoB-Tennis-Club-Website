<h3 class="text-base font-bold text-slate-800 m-0 mb-3">Log Match Result</h3>

<div id="lockedState" class="text-sm text-slate-400 italic text-center py-4 bg-slate-50 rounded-lg border border-dashed border-slate-200">
  🔑 Please log in via the portal widget to record matches.
</div>

<div id="unlockedState" class="hidden flex flex-col gap-4">
  
  <div class="flex items-center justify-between bg-slate-100 p-1.5 rounded-lg border border-slate-200">
    <span class="text-xs font-bold text-slate-700 ml-2 uppercase tracking-wider">Format</span>
    <div class="flex gap-1">
      <button id="singlesBtn" type="button" onclick="setMatchType(false)" 
              class="px-3 py-1 text-xs font-semibold rounded-md bg-white text-slate-800 shadow-xs cursor-pointer transition-all">
        Singles
      </button>
      <button id="doublesBtn" type="button" onclick="setMatchType(true)" 
              class="px-3 py-1 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-800 cursor-pointer transition-all">
        Doubles
      </button>
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <label class="text-xs font-bold text-emerald-700 uppercase tracking-wider">Winner(s)</label>
    <select id="winner1" class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 font-medium text-slate-700">
      <option value="">Select Winner 1...</option>
    </select>
    <select id="winner2" class="hidden w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 font-medium text-slate-700">
      <option value="">Select Winner 2...</option>
    </select>
  </div>

  <div class="flex flex-col gap-2">
    <label class="text-xs font-bold text-rose-700 uppercase tracking-wider">Loser(s)</label>
    <select id="loser1" class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 font-medium text-slate-700">
      <option value="">Select Loser 1...</option>
    </select>
    <select id="loser2" class="hidden w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 font-medium text-slate-700">
      <option value="">Select Loser 2...</option>
    </select>
  </div>

  <div>
    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Score</label>
    <select id="scoreSelect" class="mt-1 w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 font-medium text-slate-700">
      <option value="">Select Score...</option>
      <optgroup label="Standard Sets">
        <option value="6-0">6-0</option>
        <option value="6-1">6-1</option>
        <option value="6-2">6-2</option>
        <option value="6-3">6-3</option>
        <option value="6-4">6-4</option>
        <option value="7-5">7-5</option>
        <option value="7-6">7-6</option>
      </optgroup>
      <optgroup label="Fast4 Sets">
        <option value="4-0">4-0</option>
        <option value="4-1">4-1</option>
        <option value="4-2">4-2</option>
        <option value="4-3">4-3</option>
      </optgroup>
      <optgroup label="Best of 3 Sets">
        <option value="2-0">2-0 (Sets)</option>
        <option value="2-1">2-1 (Sets)</option>
      </optgroup>
    </select>
  </div>

  <button onclick="submitMatch()" 
          class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-xs cursor-pointer transition-colors mt-1">
    Submit Result
  </button>
  
  <div id="statusMsg" class="text-xs font-medium text-center min-h-[16px]"></div>
</div>

<script>
  window.squadPlayers = window.squadPlayers || [];
  window.isDoubles = false;

  window.checkMatchplayLoginState = function() {
    const squad = localStorage.getItem('tc_squad');
    const prefix = localStorage.getItem('tc_prefix');
    const locked = document.getElementById('lockedState');
    const unlocked = document.getElementById('unlockedState');

    if (locked && unlocked) {
      if (prefix && squad) {
        locked.classList.add('hidden');
        unlocked.classList.remove('hidden');
        if (window.squadPlayers.length === 0) window.fetchRoster(squad);
      } else {
        locked.classList.remove('hidden');
        unlocked.classList.add('hidden');
      }
    }
  };

  window.setMatchType = function(doubles) {
    window.isDoubles = doubles;
    const singlesBtn = document.getElementById('singlesBtn');
    const doublesBtn = document.getElementById('doublesBtn');
    const w2 = document.getElementById('winner2');
    const l2 = document.getElementById('loser2');

    if (!singlesBtn || !doublesBtn || !w2 || !l2) return;

    if (window.isDoubles) {
      doublesBtn.className = "px-3 py-1 text-xs font-semibold rounded-md bg-white text-slate-800 shadow-xs cursor-pointer transition-all";
      singlesBtn.className = "px-3 py-1 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-800 cursor-pointer transition-all";
      w2.classList.remove('hidden');
      l2.classList.remove('hidden');
    } else {
      singlesBtn.className = "px-3 py-1 text-xs font-semibold rounded-md bg-white text-slate-800 shadow-xs cursor-pointer transition-all";
      doublesBtn.className = "px-3 py-1 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-800 cursor-pointer transition-all";
      w2.classList.add('hidden');
      l2.classList.add('hidden');
      w2.value = "";
      l2.value = "";
    }
  };

  window.fetchRoster = async function(squadName) {
    try {
      const response = await fetch(window.API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getSquadRoster', squad: squadName })
      });
      const result = await response.json();
      
      if (result.status === "success") {
        window.squadPlayers = result.data;
        window.populateDropdowns();
      }
    } catch (err) {
      console.error("Failed to load squad roster.");
    }
  };

  window.populateDropdowns = function() {
    const dropdowns = ['winner1', 'winner2', 'loser1', 'loser2'];
    
    dropdowns.forEach(id => {
      const select = document.getElementById(id);
      if (!select) return;

      const placeholder = select.options[0] ? select.options[0].text : 'Select Player...';
      select.innerHTML = `<option value="">${placeholder}</option>`;
      
      window.squadPlayers.forEach(player => {
        const opt = document.createElement('option');
        opt.value = player;
        opt.textContent = player;
        select.appendChild(opt);
      });
    });
  };

  window.submitMatch = async function() {
    const squad = localStorage.getItem('tc_squad');
    const statusBox = document.getElementById('statusMsg');
    const scoreSelect = document.getElementById('scoreSelect');

    if (!statusBox || !scoreSelect) return;
    const score = scoreSelect.value;

    const w1 = document.getElementById('winner1') ? document.getElementById('winner1').value : "";
    const w2 = document.getElementById('winner2') ? document.getElementById('winner2').value : "";
    const l1 = document.getElementById('loser1') ? document.getElementById('loser1').value : "";
    const l2 = document.getElementById('loser2') ? document.getElementById('loser2').value : "";

    let winners = [];
    let losers = [];

    // Validation
    if (!window.isDoubles) {
      if (!w1 || !l1 || !score) {
        statusBox.className = "text-xs font-medium text-center text-red-600";
        statusBox.innerText = "Please select a winner, loser, and score.";
        return;
      }
      if (w1 === l1) {
        statusBox.className = "text-xs font-medium text-center text-red-600";
        statusBox.innerText = "Winner and loser cannot be the same player.";
        return;
      }
      winners = [w1];
      losers = [l1];
    } else {
      if (!w1 || !w2 || !l1 || !l2 || !score) {
        statusBox.className = "text-xs font-medium text-center text-red-600";
        statusBox.innerText = "Please select all 4 players and a score for doubles.";
        return;
      }
      const selected = [w1, w2, l1, l2];
      const unique = new Set(selected);
      if (unique.size !== 4) {
        statusBox.className = "text-xs font-medium text-center text-red-600";
        statusBox.innerText = "All 4 players in doubles must be unique!";
        return;
      }
      winners = [w1, w2];
      losers = [l1, l2];
    }

    statusBox.className = "text-xs font-medium text-center text-slate-500";
    statusBox.innerText = "Saving match data...";

    try {
      const response = await fetch(window.API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'submitMatchResult', squad, winners, losers, score })
      });
      const result = await response.json();
      
      if (result.status === "success") {
        statusBox.className = "text-xs font-medium text-center text-emerald-600";
        statusBox.innerText = result.message;
        
        // Reset selections
        if (document.getElementById('winner1')) document.getElementById('winner1').value = "";
        if (document.getElementById('winner2')) document.getElementById('winner2').value = "";
        if (document.getElementById('loser1')) document.getElementById('loser1').value = "";
        if (document.getElementById('loser2')) document.getElementById('loser2').value = "";
        scoreSelect.value = "";
      } else {
        statusBox.className = "text-xs font-medium text-center text-red-600";
        statusBox.innerText = result.message;
      }
    } catch (err) {
      statusBox.className = "text-xs font-medium text-center text-red-600";
      statusBox.innerText = "Failed to communicate with database.";
    }

    // Broadcast match update to Leaderboard
    const matchChannel = new BroadcastChannel('match_updates');
    matchChannel.postMessage('match_logged');
    matchChannel.close();
  };

  // Run automatically when loaded
  (function initMatchplay() {
    window.checkMatchplayLoginState();
  })();
</script>
