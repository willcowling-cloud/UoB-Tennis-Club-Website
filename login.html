<div id="loginForm">
  <h3 class="text-base font-bold text-slate-800 m-0 mb-2">Player Portal Login</h3>
  <div class="flex gap-2">
    <input type="text" id="prefixInput" placeholder="Student Prefix (e.g., abc123)" 
           class="flex-1 min-w-0 px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 text-slate-900">
    <button onclick="performLogin()" 
            class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-xs cursor-pointer transition-colors whitespace-nowrap">
      Log In
    </button>
  </div>
  <div id="loginStatus" class="text-xs text-red-600 font-medium mt-1.5 min-h-[16px]"></div>
</div>

<div id="welcomeMessage" class="hidden flex items-center justify-between w-full">
  <div>
    <span class="text-emerald-600 font-bold text-sm flex items-center gap-1">✓ Logged In</span>
    <p class="text-xs text-slate-600 m-0 mt-0.5">Welcome, <strong id="userDisp" class="text-slate-800"></strong> (<span id="squadDisp" class="italic"></span>)</p>
  </div>
  <button onclick="logout()" 
          class="px-2.5 py-1.5 bg-red-500 hover:bg-red-600 text-white text-xs font-semibold rounded-md shadow-xs cursor-pointer transition-colors">
    Log Out
  </button>
</div>

<script>
  window.performLogin = async function() {
    const prefixInput = document.getElementById('prefixInput');
    const statusBox = document.getElementById('loginStatus');
    
    if (!prefixInput || !statusBox) return;
    const prefix = prefixInput.value.trim().toLowerCase();

    if (!prefix) {
      statusBox.classList.add('text-red-600');
      statusBox.innerText = "Please enter your prefix.";
      return;
    }

    statusBox.classList.remove('text-red-600');
    statusBox.classList.add('text-slate-500');
    statusBox.innerText = "Authenticating...";

    try {
      const response = await fetch(window.API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', prefix: prefix })
      });
      const result = await response.json();

      if (result.status === "success") {
        localStorage.setItem('tc_prefix', prefix);
        localStorage.setItem('tc_name', result.playerName);
        localStorage.setItem('tc_squad', result.squadName);
        window.showWelcome(result.playerName, result.squadName);
        
        // This instantly unlocks all other modules
        if (window.triggerAppRefresh) window.triggerAppRefresh();
      } else {
        statusBox.classList.add('text-red-600');
        statusBox.innerText = result.message;
      }
    } catch (err) {
      statusBox.classList.add('text-red-600');
      statusBox.innerText = "Network Error. Check Web App settings.";
    }
  };

  window.showWelcome = function(name, squad) {
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('welcomeMessage');
    if (form && msg) {
      form.classList.add('hidden');
      document.getElementById('userDisp').innerText = name;
      document.getElementById('squadDisp').innerText = squad;
      msg.classList.remove('hidden');
    }
  };

  window.logout = function() {
    localStorage.clear();
    location.reload();
  };

  (function checkLoginState() {
    const savedName = localStorage.getItem('tc_name');
    const savedSquad = localStorage.getItem('tc_squad');
    if (savedName) window.showWelcome(savedName, savedSquad);
  })();
</script>
