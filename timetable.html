<div id="timetableLoading" class="hidden text-xs text-slate-500 italic text-center py-4">

<script>
  window.evaluateTimetableState = function() {
    const squad = localStorage.getItem('tc_squad');
    const prefix = localStorage.getItem('tc_prefix');
    
    const locked = document.getElementById('timetableLocked');
    const unlocked = document.getElementById('timetableUnlocked');
    const loading = document.getElementById('timetableLoading');

    if (!locked || !unlocked || !loading) return;
    
    if (prefix && squad) {
      locked.classList.add('hidden');
      unlocked.classList.add('hidden');
      loading.classList.remove('hidden');
      window.fetchTimetable(squad);
    } else {
      locked.classList.remove('hidden');
      unlocked.classList.add('hidden');
      loading.classList.add('hidden');
    }
  };
